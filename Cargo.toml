# =====================================================================
# CONTRA — Anchor workspace root.
# Member crates are the three on-chain programs. Build all with
# `anchor build` from the workspace root.
# =====================================================================

[workspace]
members = [
    "programs/contra_vault",
    "programs/contra_lending",
    "programs/contra_leverage",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
