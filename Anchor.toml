# =====================================================================
# CONTRA — Anchor configuration.
# Program IDs are placeholders until `anchor deploy` runs. After deploy,
# `anchor keys list` will print the real IDs — copy them into the
# [programs.devnet] section AND into `declare_id!()` in each lib.rs.
# =====================================================================

[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
contra_vault    = "Contra1111111111111111111111111111111111111"
contra_lending  = "Contra2222222222222222222222222222222222222"
contra_leverage = "Contra3333333333333333333333333333333333333"

[programs.devnet]
contra_vault    = "Contra1111111111111111111111111111111111111"
contra_lending  = "Contra2222222222222222222222222222222222222"
contra_leverage = "Contra3333333333333333333333333333333333333"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet  = "./authority.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"

# Clone devnet USDC so localnet tests have realistic mint metadata.
[[test.validator.clone]]
address = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
