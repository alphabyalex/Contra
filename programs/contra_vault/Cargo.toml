[package]
name = "contra_vault"
version = "0.1.0"
description = "CONTRA short basket vault — users deposit USDC, receive CTRS basket tokens, NAV rises on NO resolutions."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "contra_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
