[package]
name = "contra_leverage"
version = "0.1.0"
description = "CONTRA leveraged short-basket position manager. Chains CPIs into contra_lending and contra_vault."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "contra_leverage"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "contra_vault/idl-build",
    "contra_lending/idl-build",
]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
contra_vault   = { path = "../contra_vault",   features = ["cpi"] }
contra_lending = { path = "../contra_lending", features = ["cpi"] }
